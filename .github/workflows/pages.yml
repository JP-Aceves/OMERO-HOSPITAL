# Publica la carpeta web/ en GitHub Pages.
# Requisito (una sola vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Web del proyecto (GitHub Pages)

on:
  push:
    branches: [main, develop]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; si llega otro push, se espera al que está en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Validar proyecto.json
        run: python3 -m json.tool web/data/proyecto.json > /dev/null

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir la carpeta web/
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
